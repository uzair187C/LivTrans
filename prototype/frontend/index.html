<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Duet — Live Voice Translation</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-shell">

    <!-- Top Navigation -->
    <header class="top-bar">
      <div class="top-bar-left">
        <h1 class="brand">Duet</h1>
        <span class="latency-badge" id="latencyPill">—</span>
      </div>
      <div class="top-bar-right">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-label" id="statusText">Connecting…</span>
      </div>
    </header>

    <!-- Language Bar -->
    <section class="lang-bar">
      <div class="lang-chip">
        <span class="lang-flag">🇺🇸</span>
        <span class="lang-name">English</span>
      </div>
      <span class="lang-arrow">⇄</span>
      <div class="lang-chip lang-chip--select">
        <span class="lang-flag" id="targetFlag">🇲🇽</span>
        <select id="regionSelect" class="lang-select" aria-label="Select dialect">
          <option value="Mexican" selected>Mexican</option>
          <option value="Argentinian">Argentine</option>
          <option value="Colombian">Colombian</option>
          <option value="Caribbean">Caribbean</option>
          <option value="Spain">Spain</option>
          <option value="Peruvian">Peruvian</option>
          <option value="Neutral">Standard</option>
        </select>
      </div>
    </section>

    <!-- Mode Selector -->
    <div class="mode-bar">
      <div class="mode-pills">
        <button class="mode-pill" data-mode="captions">📝 Captions</button>
        <button class="mode-pill active" data-mode="spoken">🔊 Voice</button>
        <button class="mode-pill" data-mode="layered">📝🔊 Both</button>
      </div>
    </div>

    <!-- Conversation Feed -->
    <main class="feed" id="conversationFeed">
      <div class="feed-empty" id="emptyState">
        <div class="feed-empty-icon">
          <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="22"/>
          </svg>
        </div>
        <h3>Place device between speakers</h3>
        <p>Speak naturally in English or Spanish. Duet detects who's talking and translates with real slang.</p>
      </div>

      <!-- Live partial transcript bubble (hidden by default) -->
      <div class="live-bubble" id="liveBubble" style="display:none;">
        <div class="live-bubble-header">
          <span class="live-dot"></span>
          <span class="live-label" id="liveStatusLabel">Listening…</span>
        </div>
        <p class="live-text" id="livePartialText">…</p>
      </div>
    </main>

    <!-- Bottom Action Bar -->
    <footer class="action-bar">
      <!-- Visualizer -->
      <div class="viz-wrapper">
        <div class="mic-status" id="micStatusRow">
          <span class="mic-dot" id="micLiveDot"></span>
          <span class="mic-label" id="micStatusText">Tap Start to begin</span>
        </div>
        <canvas id="pitchWaveCanvas" class="viz-canvas" width="360" height="48"></canvas>
      </div>

      <!-- Big Mic Button -->
      <button id="micButton" class="mic-btn idle" aria-label="Start Conversation">
        <span class="mic-btn-icon">
          <svg id="micIcon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="22"/>
          </svg>
          <svg id="stopIcon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" style="display:none;">
            <rect x="6" y="6" width="12" height="12" rx="2"/>
          </svg>
        </span>
        <span id="micButtonLabel">Start Conversation</span>
      </button>

      <!-- Sub-controls -->
      <div class="sub-controls">
        <label class="toggle-row">
          <input type="checkbox" id="echoCancelToggle" checked>
          <span class="toggle-track"></span>
          <span>Echo Shield</span>
        </label>
        <span class="sub-divider">·</span>
        <button id="testPhraseBtn" class="test-phrase-btn" type="button" title="Send a test sentence to verify translation & voice">🧪 Test Sample</button>
      </div>
    </footer>

    <!-- Debug Panel (visible during development) -->
    <details class="debug-details" open>
      <summary>🔧 Debug Console</summary>
      <div class="debug-log" id="debugPanel"></div>
    </details>

  </div>

  <script src="app.js"></script>
</body>
</html>
