<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Duet — Live Voice Translation</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    
    <!-- Top Bar: Clean Minimal Header -->
    <header class="top-nav">
      <div class="nav-brand">
        <span class="app-title">Duet</span>
        <span class="pill-badge" id="latencyPill">-- ms</span>
      </div>

      <!-- Mode Selector (Segmented Pill) -->
      <div class="mode-pill-group">
        <button type="button" class="mode-pill-btn" data-mode="captions" id="btnCaptions">Captions</button>
        <button type="button" class="mode-pill-btn active" data-mode="spoken" id="btnSpoken">Voice</button>
        <button type="button" class="mode-pill-btn" data-mode="layered" id="btnLayered">Layered</button>
      </div>

      <div class="nav-status">
        <span class="status-indicator-dot disconnected" id="statusDot"></span>
        <span class="status-indicator-text" id="statusText">Connecting</span>
      </div>
    </header>

    <!-- Language & Dialect Bar -->
    <section class="lang-bar">
      <div class="lang-tag">
        <span class="flag">🇺🇸</span>
        <span class="lang-name">English</span>
      </div>
      <div class="swap-icon">⇄</div>
      <div class="lang-tag dialect-picker">
        <span class="flag" id="targetFlag">🇲🇽</span>
        <select id="regionSelect" class="dialect-select" aria-label="Select Spanish dialect">
          <option value="Mexican" selected>Spanish (Mexican)</option>
          <option value="Peruvian">Spanish (Peruvian)</option>
          <option value="Argentinian">Spanish (Argentine)</option>
          <option value="Colombian">Spanish (Colombian)</option>
          <option value="Caribbean">Spanish (Caribbean)</option>
          <option value="Spain">Spanish (Spain)</option>
          <option value="Neutral">Spanish (Standard)</option>
        </select>
      </div>
    </section>

    <!-- Conversation Feed -->
    <main class="feed-container" id="conversationFeed">
      
      <!-- Welcome Empty State -->
      <div class="empty-feed" id="emptyState">
        <div class="empty-icon-circle">
          <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="22"/>
          </svg>
        </div>
        <h3>Place device between both speakers</h3>
        <p>Talk naturally in English or Spanish with real slang. Duet auto-detects who is speaking and translates with natural colloquial emotion.</p>
      </div>

      <!-- Real-time Live Partial Transcript Bubble -->
      <div class="live-stream-card" id="liveBubble" style="display: none;">
        <div class="live-card-header">
          <span class="live-pulse-dot"></span>
          <span class="live-status-label" id="liveStatusLabel">Listening...</span>
        </div>
        <p class="live-card-text" id="livePartialText">...</p>
      </div>

    </main>

    <!-- Bottom Controls & Action Bar -->
    <footer class="bottom-action-bar">
      
      <!-- Live Audio Volume Visualizer -->
      <div class="audio-visualizer-container" id="audioVisualizer" style="opacity: 0;">
        <span class="visualizer-bar"></span>
        <span class="visualizer-bar"></span>
        <span class="visualizer-bar"></span>
        <span class="visualizer-bar"></span>
        <span class="visualizer-bar"></span>
        <span class="visualizer-bar"></span>
        <span class="visualizer-bar"></span>
        <span class="visualizer-bar"></span>
        <span class="visualizer-bar"></span>
        <span class="visualizer-bar"></span>
        <span class="visualizer-bar"></span>
        <span class="visualizer-bar"></span>
      </div>

      <!-- Primary Big Mic Button -->
      <button id="micButton" class="main-mic-btn idle" aria-label="Start Conversation">
        <div class="btn-icon">
          <svg id="micIcon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="22"/>
          </svg>
          <svg id="stopIcon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" style="display: none;">
            <rect x="6" y="6" width="12" height="12" rx="2"/>
          </svg>
        </div>
        <span id="micButtonLabel">Start Conversation</span>
      </button>

      <div class="sub-controls-row">
        <label class="clean-toggle">
          <input type="checkbox" id="echoCancelToggle" checked>
          <span class="toggle-track"></span>
          <span>Echo Protection</span>
        </label>
        <span class="divider-dot">•</span>
        <span class="engine-info">Gemini Flash-Lite</span>
      </div>

    </footer>

  </div>

  <script src="app.js"></script>
</body>
</html>
